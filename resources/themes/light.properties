# =====================================================================================
#  Tint & Shade Palette Generator  -  LIGHT theme   (c) JSoft Bharath
#
#  Colors : #RRGGBB  or  #RRGGBBAA        Alias : @other.key  (re-uses another color)
#  Fonts  : any installed family; first match of the comma separated list wins.
#
#  To customize: copy this file next to the jar as  theme.properties  (View > Edit theme
#  file does that for you), change anything, save. The running app reloads it live.
#  A custom file only needs the keys you want to change; add "extends = dark" to start
#  from the dark theme instead of the light one.
# =====================================================================================
name = Light

# ---- shape & fonts -------------------------------------------------------------------
shape.radius        = 0
font.body           = Inter, Segoe UI, Helvetica Neue, Dialog
font.body.size      = 11
